[project]
name = "vllm-env"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = [
  # Prebuilt kernels, so flashinfer loads them instead of invoking nvcc on every cold start.
  "flashinfer-cubin==0.7.0.post1",
  "flashinfer-jit-cache==0.7.0.post1",
  "flashinfer-jit-cache-sm120f==0.7.0.post1+cu130",
  "flashinfer-python==0.7.0.post1",
  "vllm==0.31.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
exclude-newer = "1 day"
preview-features = ["index-exclude-newer"]

# The shim only needs our pinned Blackwell provider.
[[tool.uv.dependency-metadata]]
name = "flashinfer-jit-cache"
requires-dist = ["flashinfer-jit-cache-sm120f"]

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl"
explicit = true
exclude-newer = false

[[tool.uv.index]]
name = "flashinfer-cu130"
url = "https://flashinfer.ai/whl/cu130"
explicit = true
exclude-newer = false

[tool.uv.sources]
flashinfer-cubin = { index = "flashinfer" }
flashinfer-jit-cache = { index = "flashinfer-cu130" }
flashinfer-jit-cache-sm120f = { index = "flashinfer-cu130" }
