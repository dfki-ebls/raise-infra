[project]
name = "vllm-env"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = [
  # Prebuilt kernels, so flashinfer loads them instead of invoking nvcc on every cold start.
  "flashinfer-cubin==0.6.18",
  "flashinfer-jit-cache==0.6.18",
  "flashinfer-python==0.6.18",
  "vllm==0.29.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
exclude-newer = "3 days"

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu130"
url = "https://flashinfer.ai/whl/cu130"
explicit = true

[tool.uv.sources]
flashinfer-cubin = { index = "flashinfer" }
flashinfer-jit-cache = { index = "flashinfer-cu130" }

[tool.uv.exclude-newer-package]
vllm = "1 day"
flashinfer-cubin = false
flashinfer-jit-cache = false
